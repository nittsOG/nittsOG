<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#0c3035" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="400" rx="22" fill="url(#bg)"/>
<rect x="16" y="16" width="1368" height="368" rx="17" fill="url(#grid)" opacity=".58"/>
