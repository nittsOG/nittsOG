<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
<title id="title">Cybersecurity focus matrix</title>
<desc id="desc">Security is the core domain with application, product, OT/ICS, AI and research focus areas.</desc>
<defs>
